<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>傾きで答え表示する単語帳（beta=50以下で表示）</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 16px;
    }
    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #999;
      background: #fff;
      font-size: 14px;
    }
    button:disabled {
      opacity: .5;
    }
    .q {
      margin-top: 12px;
      font-size: 22px;
      font-weight: 700;
    }
    .a {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f3f3;
      display: none;
      font-size: 18px;
      font-weight: 600;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      white-space: pre-wrap;
    }
    details {
      margin-top: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 10px;
    }
    summary {
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    label {
      font-size: 12px;
      display: block;
      margin-bottom: 4px;
    }
    input[type="range"],
    input[type="number"] {
      width: 100%;
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <button id="enableBtn">傾き操作を有効化（許可）</button>

    <div class="q">apple</div>
    <div class="a" id="answer">りんご</div>

    <div class="hint">
      通常姿勢：beta ≈ 70<br>
      <strong>50以下</strong>まで奥に倒すと答え表示／<strong>60以上</strong>で非表示
    </div>

    <div class="status" id="status"></div>
  </div>

  <details open>
    <summary>判定パラメータ</summary>
    <div class="grid">
      <div>
        <label>表示ON（beta ≤）</label>
        <input id="onBeta" type="range" min="0" max="90" step="1" value="50">
      </div>
      <div>
        <label>表示OFF（beta ≥）</label>
        <input id="offBeta" type="range" min="0" max="90" step="1" value="60">
      </div>
      <div>
        <label>平滑化</label>
        <input id="smooth" type="range" min="0.05" max="0.5" step="0.01" value="0.2">
      </div>
      <div>
        <label>クールダウン(ms)</label>
        <input id="cooldown" type="number" min="0" max="2000" step="50" value="250">
      </div>
    </div>
  </details>
</div>

<script>
  const enableBtn = document.getElementById("enableBtn");
  const answerEl = document.getElementById("answer");
  const statusEl = document.getElementById("status");

  const onBetaEl = document.getElementById("onBeta");
  const offBetaEl = document.getElementById("offBeta");
  const smoothEl = document.getElementById("smooth");
  const cooldownEl = document.getElementById("cooldown");

  let isRevealed = false;
  let betaSmoothed = 0;
  let lastToggleAt = 0;
  let started = false;

  const setReveal = (reveal) => {
    isRevealed = reveal;
    answerEl.style.display = reveal ? "block" : "none";
  };

  const requestPermission = async () => {
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      return await DeviceOrientationEvent.requestPermission();
    }
    return "granted";
  };

  const startSensor = () => {
    if (started) return;

    window.addEventListener("deviceorientation", (e) => {
      if (typeof e.beta !== "number") return;

      const onBeta = Number(onBetaEl.value);
      const offBeta = Number(offBetaEl.value);
      const smoothing = Number(smoothEl.value);
      const cooldown = Number(cooldownEl.value);

      betaSmoothed += (e.beta - betaSmoothed) * smoothing;

      const now = performance.now();
      const canToggle = now - lastToggleAt >= cooldown;

      // ★ betaが下がったら表示、戻ったら非表示
      if (!isRevealed && betaSmoothed <= onBeta && canToggle) {
        setReveal(true);
        lastToggleAt = now;
      } else if (isRevealed && betaSmoothed >= offBeta && canToggle) {
        setReveal(false);
        lastToggleAt = now;
      }

      statusEl.textContent =
        `beta(raw): ${e.beta.toFixed(1)}\n` +
        `beta(smooth): ${betaSmoothed.toFixed(1)}\n` +
        `ON ≤ ${onBeta} / OFF ≥ ${offBeta}\n` +
        `revealed: ${isRevealed}`;
    }, { passive: true });

    started = true;
  };

  enableBtn.addEventListener("click", async () => {
    enableBtn.disabled = true;

    const res = await requestPermission();
    if (res !== "granted") {
      statusEl.textContent = "センサーの許可が得られませんでした。";
      enableBtn.disabled = false;
      return;
    }

    startSensor();
    enableBtn.textContent = "傾き操作：有効";
  });
</script>
</body>
</html>
